<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Brillouin Zone Viewer</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --border: #30363d;
    --fg: #c9d1d9;
    --accent: #58a6ff;
    --muted: #8b949e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
               background: var(--bg); color: var(--fg);
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                            Helvetica, Arial, sans-serif; }
  #app { display: flex; height: 100vh; }
  #controls { width: 320px; padding: 14px; overflow-y: auto;
              background: var(--panel); border-right: 1px solid var(--border);
              font-size: 13px; }
  #controls h1 { font-size: 14px; margin: 0 0 4px 0; color: var(--accent); }
  #controls .subtitle { color: var(--muted); font-size: 11px;
                        margin-bottom: 12px; }
  fieldset { border: 1px solid var(--border); border-radius: 4px;
             padding: 8px 10px 10px 10px; margin: 0 0 10px 0; }
  legend  { padding: 0 6px; color: var(--accent); font-size: 12px;
            font-weight: 600; }
  label   { display: block; margin: 4px 0; font-size: 12px; }
  select, input[type=range], input[type=number] {
            width: 100%; background: var(--bg); color: var(--fg);
            border: 1px solid var(--border); border-radius: 3px;
            padding: 4px 6px; font-size: 12px; }
  input[type=range] { padding: 0; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { flex: 0 0 64px; margin: 6px 0; }
  .row input[type=range] { flex: 1 1 auto; }
  .row .val { flex: 0 0 48px; color: var(--muted); text-align: right;
              font-variant-numeric: tabular-nums; }
  .check { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .check input { width: auto; margin: 0; }
  .pill { display: inline-block; padding: 2px 6px; border-radius: 8px;
          background: var(--bg); border: 1px solid var(--border);
          color: var(--muted); font-size: 10px; }
  #stage { flex: 1; position: relative; }
  #canvas { position: absolute; inset: 0; display: block; }
  #legend { position: absolute; top: 10px; right: 10px;
            background: rgba(22,27,34,0.85); border: 1px solid var(--border);
            border-radius: 4px; padding: 8px 10px; font-size: 11px;
            color: var(--muted); pointer-events: none; }
  .swatch { display: inline-block; width: 10px; height: 10px;
            border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  #hint  { position: absolute; bottom: 10px; left: 10px; font-size: 11px;
           color: var(--muted); pointer-events: none; }
</style>
</head>
<body>
<div id="app">
  <aside id="controls">
    <h1>Brillouin Zone Viewer</h1>
    <div class="subtitle">Real-space lattice and its first BZ, both live</div>

    <fieldset>
      <legend>Bravais lattice</legend>
      <select id="lattice"></select>
      <div id="lattice-info" class="subtitle" style="margin-top:6px"></div>
    </fieldset>

    <fieldset id="params-box">
      <legend>Parameters</legend>
      <div id="params"></div>
    </fieldset>

    <fieldset>
      <legend>Cell to display</legend>
      <label class="check">
        <input type="radio" name="cell" value="primitive" checked> Primitive cell
      </label>
      <label class="check">
        <input type="radio" name="cell" value="conventional"> Conventional cell
      </label>
    </fieldset>

    <fieldset>
      <legend>Show</legend>
      <label class="check"><input type="checkbox" id="show-bz" checked>
        <span><span class="swatch" style="background:#facc15"></span>Brillouin zone</span></label>
      <label class="check"><input type="checkbox" id="show-bz-faces" checked>
        <span class="pill">filled</span> &nbsp;BZ face shading</label>
      <label class="check"><input type="checkbox" id="show-cell" checked>
        <span><span class="swatch" style="background:#06b6d4"></span>Lattice cell</span></label>
      <label class="check"><input type="checkbox" id="show-points" checked>
        <span><span class="swatch" style="background:#ffffff"></span>Lattice points</span></label>
      <label class="check"><input type="checkbox" id="show-real" checked>
        <span><span class="swatch" style="background:#fb923c"></span>Real vectors aᵢ</span></label>
      <label class="check"><input type="checkbox" id="show-recip" checked>
        <span><span class="swatch" style="background:#e879f9"></span>Reciprocal vectors bᵢ</span></label>
      <label class="check"><input type="checkbox" id="show-axes" checked>
        <span class="swatch" style="background:#ef4444"></span>
        <span class="swatch" style="background:#22c55e"></span>
        <span class="swatch" style="background:#3b82f6"></span>
        k_x, k_y, k_z axes
      </label>
    </fieldset>

    <fieldset>
      <legend>Diagnostics</legend>
      <div id="diag" class="subtitle" style="font-family:monospace"></div>
    </fieldset>
  </aside>

  <div id="stage">
    <canvas id="canvas"></canvas>
    <div id="legend">
      <div><span class="swatch" style="background:#ef4444"></span>k_x &nbsp;
           <span class="swatch" style="background:#22c55e"></span>k_y &nbsp;
           <span class="swatch" style="background:#3b82f6"></span>k_z</div>
      <div><span class="swatch" style="background:#fb923c"></span>a₁,a₂,a₃ &nbsp;
           <span class="swatch" style="background:#e879f9"></span>b₁,b₂,b₃</div>
      <div><span class="swatch" style="background:#06b6d4"></span>real-space cell &nbsp;
           <span class="swatch" style="background:#facc15"></span>BZ</div>
    </div>
    <div id="hint">drag = rotate · scroll = zoom · right-drag = pan</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─────────────────────── 1. Lattice presets ──────────────────────────────
// Each entry exposes parameters (slider min/max/default) and two factory
// functions that return primitive and conventional basis vectors as
// row-major [a1,a2,a3].  For non-trivial centred lattices the "basis"
// gives the extra sites inside the conventional cell as fractional coords.

const TWOPI = 2 * Math.PI;
const DEG = Math.PI / 180;

const LATTICES = {
  cubic_P: {
    name: 'Cubic — Simple (P)',
    note: 'a₁,₂,₃ = a x̂,ŷ,ẑ  ·  BZ = cube  ·  primitive = conventional',
    params: { a: [0.5, 2.0, 1.0] },
    primitive: p => [[p.a,0,0],[0,p.a,0],[0,0,p.a]],
    conventional: p => [[p.a,0,0],[0,p.a,0],[0,0,p.a]],
    basis: () => [[0,0,0]],
  },
  cubic_I: {
    name: 'Cubic — Body-centred (I) [BCC]',
    note: 'BZ = rhombic dodecahedron  ·  conv. cell holds 2 sites',
    params: { a: [0.5, 2.0, 1.0] },
    primitive: p => [[-p.a/2,p.a/2,p.a/2],[p.a/2,-p.a/2,p.a/2],[p.a/2,p.a/2,-p.a/2]],
    conventional: p => [[p.a,0,0],[0,p.a,0],[0,0,p.a]],
    basis: () => [[0,0,0],[0.5,0.5,0.5]],
  },
  cubic_F: {
    name: 'Cubic — Face-centred (F) [FCC]',
    note: 'BZ = truncated octahedron  ·  conv. cell holds 4 sites',
    params: { a: [0.5, 2.0, 1.0] },
    primitive: p => [[0,p.a/2,p.a/2],[p.a/2,0,p.a/2],[p.a/2,p.a/2,0]],
    conventional: p => [[p.a,0,0],[0,p.a,0],[0,0,p.a]],
    basis: () => [[0,0,0],[0.5,0.5,0],[0.5,0,0.5],[0,0.5,0.5]],
  },
  tetragonal_P: {
    name: 'Tetragonal — Simple (P)',
    note: 'a, a, c  ·  α = β = γ = 90°',
    params: { a: [0.5, 2.0, 1.0], c: [0.5, 3.0, 1.5] },
    primitive: p => [[p.a,0,0],[0,p.a,0],[0,0,p.c]],
    conventional: p => [[p.a,0,0],[0,p.a,0],[0,0,p.c]],
    basis: () => [[0,0,0]],
  },
  tetragonal_I: {
    name: 'Tetragonal — Body-centred (I)',
    note: 'BZ shape depends on c/a — try c/a < √2 vs c/a > √2',
    params: { a: [0.5, 2.0, 1.0], c: [0.5, 3.0, 1.5] },
    primitive: p => [[-p.a/2,p.a/2,p.c/2],[p.a/2,-p.a/2,p.c/2],[p.a/2,p.a/2,-p.c/2]],
    conventional: p => [[p.a,0,0],[0,p.a,0],[0,0,p.c]],
    basis: () => [[0,0,0],[0.5,0.5,0.5]],
  },
  ortho_P: {
    name: 'Orthorhombic — Simple (P)',
    note: 'three distinct edges a ≠ b ≠ c, all right angles',
    params: { a: [0.5, 2.0, 1.0], b: [0.5, 2.0, 1.4], c: [0.5, 2.5, 1.8] },
    primitive: p => [[p.a,0,0],[0,p.b,0],[0,0,p.c]],
    conventional: p => [[p.a,0,0],[0,p.b,0],[0,0,p.c]],
    basis: () => [[0,0,0]],
  },
  ortho_C: {
    name: 'Orthorhombic — Base-centred (C)',
    note: 'extra site at (½, ½, 0)',
    params: { a: [0.5, 2.0, 1.0], b: [0.5, 2.0, 1.4], c: [0.5, 2.5, 1.8] },
    primitive: p => [[p.a/2,-p.b/2,0],[p.a/2,p.b/2,0],[0,0,p.c]],
    conventional: p => [[p.a,0,0],[0,p.b,0],[0,0,p.c]],
    basis: () => [[0,0,0],[0.5,0.5,0]],
  },
  ortho_I: {
    name: 'Orthorhombic — Body-centred (I)',
    note: 'extra site at the body centre',
    params: { a: [0.5, 2.0, 1.0], b: [0.5, 2.0, 1.4], c: [0.5, 2.5, 1.8] },
    primitive: p => [[-p.a/2,p.b/2,p.c/2],[p.a/2,-p.b/2,p.c/2],[p.a/2,p.b/2,-p.c/2]],
    conventional: p => [[p.a,0,0],[0,p.b,0],[0,0,p.c]],
    basis: () => [[0,0,0],[0.5,0.5,0.5]],
  },
  ortho_F: {
    name: 'Orthorhombic — Face-centred (F)',
    note: 'extra sites on every face centre',
    params: { a: [0.5, 2.0, 1.0], b: [0.5, 2.0, 1.4], c: [0.5, 2.5, 1.8] },
    primitive: p => [[0,p.b/2,p.c/2],[p.a/2,0,p.c/2],[p.a/2,p.b/2,0]],
    conventional: p => [[p.a,0,0],[0,p.b,0],[0,0,p.c]],
    basis: () => [[0,0,0],[0.5,0.5,0],[0.5,0,0.5],[0,0.5,0.5]],
  },
  hexagonal: {
    name: 'Hexagonal (P)',
    note: 'a₁·a₂ at 120°  ·  BZ = hexagonal prism',
    params: { a: [0.5, 2.0, 1.0], c: [0.5, 3.0, 1.6] },
    primitive: p => [[p.a,0,0],[-p.a/2,p.a*Math.sqrt(3)/2,0],[0,0,p.c]],
    conventional: p => [[p.a,0,0],[-p.a/2,p.a*Math.sqrt(3)/2,0],[0,0,p.c]],
    basis: () => [[0,0,0]],
  },
  rhombohedral: {
    name: 'Rhombohedral / Trigonal (R)',
    note: 'α=60°→FCC · α=90°→SC · α≈109.47°→BCC',
    params: { a: [0.5, 2.0, 1.0], alpha_deg: [30, 130, 60] },
    primitive: p => {
      const c = Math.cos(p.alpha_deg * DEG);
      const tx = Math.sqrt((1 - c) / 2);
      const ty = Math.sqrt((1 - c) / 6);
      const tz = Math.sqrt((1 + 2 * c) / 3);
      return [
        [p.a*tx, -p.a*ty, p.a*tz],
        [0,      2*p.a*ty, p.a*tz],
        [-p.a*tx, -p.a*ty, p.a*tz],
      ];
    },
    conventional: function (p) { return this.primitive(p); },
    basis: () => [[0,0,0]],
  },
  monoclinic_P: {
    name: 'Monoclinic — Simple (P)',
    note: 'β ≠ 90°, others = 90° (β between a and c)',
    params: { a: [0.5, 2.0, 1.0], b: [0.5, 2.0, 1.4], c: [0.5, 2.5, 1.8],
              beta_deg: [60, 130, 110] },
    primitive: p => [
      [p.a, 0, 0],
      [0, p.b, 0],
      [p.c*Math.cos(p.beta_deg*DEG), 0, p.c*Math.sin(p.beta_deg*DEG)],
    ],
    conventional: function (p) { return this.primitive(p); },
    basis: () => [[0,0,0]],
  },
  monoclinic_C: {
    name: 'Monoclinic — Base-centred (C)',
    note: 'extra site at (½, ½, 0) of the conventional cell',
    params: { a: [0.5, 2.0, 1.0], b: [0.5, 2.0, 1.4], c: [0.5, 2.5, 1.8],
              beta_deg: [60, 130, 110] },
    primitive: p => {
      const cb = Math.cos(p.beta_deg*DEG), sb = Math.sin(p.beta_deg*DEG);
      return [[p.a/2, -p.b/2, 0], [p.a/2, p.b/2, 0], [p.c*cb, 0, p.c*sb]];
    },
    conventional: p => [[p.a, 0, 0], [0, p.b, 0],
                         [p.c*Math.cos(p.beta_deg*DEG), 0, p.c*Math.sin(p.beta_deg*DEG)]],
    basis: () => [[0,0,0],[0.5,0.5,0]],
  },
  triclinic: {
    name: 'Triclinic (P)',
    note: 'lowest symmetry — three edges and three angles, all free',
    params: { a: [0.5, 2.0, 1.0], b: [0.5, 2.0, 1.2], c: [0.5, 2.5, 1.6],
              alpha_deg: [40, 140, 75], beta_deg: [40, 140, 80],
              gamma_deg: [40, 140, 95] },
    primitive: p => {
      const ca = Math.cos(p.alpha_deg*DEG),
            cb = Math.cos(p.beta_deg*DEG),
            cg = Math.cos(p.gamma_deg*DEG),
            sg = Math.sin(p.gamma_deg*DEG);
      const cx = cb,
            cy = (ca - cb*cg) / sg;
      const cz2 = 1 - cx*cx - cy*cy;
      const cz = Math.sqrt(Math.max(cz2, 1e-9));
      return [
        [p.a, 0, 0],
        [p.b*cg, p.b*sg, 0],
        [p.c*cx, p.c*cy, p.c*cz],
      ];
    },
    conventional: function (p) { return this.primitive(p); },
    basis: () => [[0,0,0]],
  },
};

// ─────────────────────── 2. Linear algebra ────────────────────────────────
const v3 = (x,y,z) => [x,y,z];
const add = (a,b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]];
const sub = (a,b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const muls = (a,s) => [a[0]*s, a[1]*s, a[2]*s];
const dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => Math.sqrt(dot(a,a));
function det3(m) {
  return m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1])
       - m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0])
       + m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]);
}
function solve3(A, b) {
  const D = det3(A);
  if (Math.abs(D) < 1e-12) return null;
  const Ax = [[b[0],A[0][1],A[0][2]],[b[1],A[1][1],A[1][2]],[b[2],A[2][1],A[2][2]]];
  const Ay = [[A[0][0],b[0],A[0][2]],[A[1][0],b[1],A[1][2]],[A[2][0],b[2],A[2][2]]];
  const Az = [[A[0][0],A[0][1],b[0]],[A[1][0],A[1][1],b[1]],[A[2][0],A[2][1],b[2]]];
  return [det3(Ax)/D, det3(Ay)/D, det3(Az)/D];
}

function reciprocal(a1, a2, a3) {
  const V = dot(a1, cross(a2, a3));
  return [
    muls(cross(a2, a3), TWOPI / V),
    muls(cross(a3, a1), TWOPI / V),
    muls(cross(a1, a2), TWOPI / V),
  ];
}

function gatherNeighbors(b1, b2, b3, nmax = 3, factor = 2.5) {
  const dmin = Math.min(norm(b1), norm(b2), norm(b3));
  const rmax = factor * dmin;
  const out = [];
  for (let i = -nmax; i <= nmax; i++)
    for (let j = -nmax; j <= nmax; j++)
      for (let k = -nmax; k <= nmax; k++) {
        if (i === 0 && j === 0 && k === 0) continue;
        const p = add(add(muls(b1, i), muls(b2, j)), muls(b3, k));
        if (norm(p) <= rmax) out.push(p);
      }
  return out;
}

// ─────────────────────── 3. Wigner-Seitz / BZ algorithm ───────────────────
// Vertex enumeration from triples of bisecting half-spaces.  For each
// neighbour R, the half-space is  R · x ≤ |R|²/2.
function wsCell(neighbors, tol = 1e-7) {
  const N = neighbors.length;
  const normals = neighbors;
  const offsets = neighbors.map(n => dot(n,n) / 2);

  const verts = [];
  const planesOfVertex = [];

  for (let i = 0; i < N; i++)
  for (let j = i+1; j < N; j++)
  for (let k = j+1; k < N; k++) {
    const A = [normals[i], normals[j], normals[k]];
    const v = solve3(A, [offsets[i], offsets[j], offsets[k]]);
    if (!v) continue;

    let ok = true;
    for (let m = 0; m < N; m++) {
      if (dot(normals[m], v) > offsets[m] + tol) { ok = false; break; }
    }
    if (!ok) continue;

    const onPlanes = [];
    for (let m = 0; m < N; m++) {
      if (Math.abs(dot(normals[m], v) - offsets[m]) < tol) onPlanes.push(m);
    }

    let dup = false;
    for (const w of verts) {
      if (norm(sub(v, w)) < tol) { dup = true; break; }
    }
    if (dup) continue;

    verts.push(v);
    planesOfVertex.push(onPlanes);
  }

  // Group vertices by face
  const faceVerts = Array.from({length: N}, () => []);
  for (let vi = 0; vi < verts.length; vi++) {
    for (const f of planesOfVertex[vi]) faceVerts[f].push(vi);
  }

  // Sort each face CCW about its centroid in local 2-D
  const faces = [];
  for (let f = 0; f < N; f++) {
    const idx = faceVerts[f];
    if (idx.length < 3) continue;
    const n = normals[f], nL = norm(n);
    const nh = [n[0]/nL, n[1]/nL, n[2]/nL];
    const c = [0,0,0];
    for (const i of idx) { c[0] += verts[i][0]; c[1] += verts[i][1]; c[2] += verts[i][2]; }
    c[0] /= idx.length; c[1] /= idx.length; c[2] /= idx.length;
    const tmp = Math.abs(nh[2]) < 0.9 ? [0,0,1] : [1,0,0];
    let e1 = cross(nh, tmp); const e1L = norm(e1);
    e1 = [e1[0]/e1L, e1[1]/e1L, e1[2]/e1L];
    const e2 = cross(nh, e1);
    const a = idx.map(i => {
      const d = sub(verts[i], c);
      return Math.atan2(dot(d, e2), dot(d, e1));
    });
    const order = idx.map((v,i) => [v, a[i]]).sort((x,y) => x[1]-y[1]).map(x => x[0]);
    faces.push(order);
  }

  return { verts, faces };
}

// ─────────────────────── 4. Three.js scene ────────────────────────────────
const canvas = document.getElementById('canvas');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1116);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);

const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 200);
camera.position.set(6, 5, 7);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const dir = new THREE.DirectionalLight(0xffffff, 0.6);
dir.position.set(5, 8, 5);
scene.add(dir);

function onResize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);

// Root group, cleared and rebuilt on every parameter change
const root = new THREE.Group();
scene.add(root);

function clearRoot() {
  while (root.children.length) {
    const c = root.children.pop();
    c.traverse?.(o => {
      o.geometry?.dispose();
      if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
      else o.material?.dispose();
    });
  }
}

// ─────────────────────── 5. Drawing primitives ────────────────────────────
function lineSegMesh(pairs, color, opacity = 1, linewidth = 1) {
  const pos = [];
  for (const [p, q] of pairs) {
    pos.push(p[0], p[1], p[2], q[0], q[1], q[2]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const m = new THREE.LineBasicMaterial({ color, transparent: opacity < 1,
                                          opacity, linewidth });
  return new THREE.LineSegments(g, m);
}

function arrow(origin, vec, color, headFrac = 0.18) {
  const dir = new THREE.Vector3(vec[0], vec[1], vec[2]);
  const len = dir.length();
  dir.normalize();
  const a = new THREE.ArrowHelper(dir, new THREE.Vector3(origin[0], origin[1], origin[2]),
                                   len, color, len * headFrac, len * headFrac * 0.55);
  a.line.material.linewidth = 2;
  return a;
}

function parallelepipedEdges(a1, a2, a3, origin = [0,0,0]) {
  // 8 corners, 12 edges
  const C = [];
  for (let i = 0; i < 2; i++)
    for (let j = 0; j < 2; j++)
      for (let k = 0; k < 2; k++) {
        C.push(add(add(add(origin, muls(a1, i)), muls(a2, j)), muls(a3, k)));
      }
  // index pairs along each axis pair
  const E = [];
  function addEdge(p, q) { E.push([C[p], C[q]]); }
  addEdge(0,1); addEdge(0,2); addEdge(0,4);
  addEdge(1,3); addEdge(1,5);
  addEdge(2,3); addEdge(2,6);
  addEdge(3,7);
  addEdge(4,5); addEdge(4,6);
  addEdge(5,7); addEdge(6,7);
  return E;
}

function bzGeometry(verts, faces) {
  // Edges
  const edgeSet = new Set();
  for (const f of faces) {
    for (let i = 0; i < f.length; i++) {
      const a = f[i], b = f[(i+1) % f.length];
      const lo = Math.min(a,b), hi = Math.max(a,b);
      edgeSet.add(lo + ',' + hi);
    }
  }
  const edges = [];
  for (const e of edgeSet) {
    const [a,b] = e.split(',').map(Number);
    edges.push([verts[a], verts[b]]);
  }
  // Triangulated faces (fan from face[0])
  const tri = { positions: [], indices: [] };
  let base = 0;
  for (const f of faces) {
    for (const vi of f) {
      const v = verts[vi];
      tri.positions.push(v[0], v[1], v[2]);
    }
    for (let i = 1; i < f.length - 1; i++) {
      tri.indices.push(base, base + i, base + i + 1);
    }
    base += f.length;
  }
  return { edges, tri };
}

// ─────────────────────── 6. Build / rebuild the scene ─────────────────────
const ui = {
  lattice: document.getElementById('lattice'),
  paramsBox: document.getElementById('params'),
  info: document.getElementById('lattice-info'),
  diag: document.getElementById('diag'),
  showBZ: document.getElementById('show-bz'),
  showBZFaces: document.getElementById('show-bz-faces'),
  showCell: document.getElementById('show-cell'),
  showPoints: document.getElementById('show-points'),
  showReal: document.getElementById('show-real'),
  showRecip: document.getElementById('show-recip'),
  showAxes: document.getElementById('show-axes'),
  cellRadios: () => document.getElementsByName('cell'),
};

// Populate lattice dropdown
for (const key of Object.keys(LATTICES)) {
  const opt = document.createElement('option');
  opt.value = key; opt.textContent = LATTICES[key].name;
  ui.lattice.appendChild(opt);
}
ui.lattice.value = 'cubic_F';

const currentParams = {};
function buildParamControls() {
  ui.paramsBox.innerHTML = '';
  const def = LATTICES[ui.lattice.value];
  for (const [k, v] of Object.entries(def.params)) {
    const [mn, mx, init] = v;
    currentParams[k] = currentParams[k] ?? init;
    if (!(k in def.params)) continue;
    if (currentParams[k] < mn || currentParams[k] > mx) currentParams[k] = init;
    const row = document.createElement('div');
    row.className = 'row';
    const isDeg = k.endsWith('_deg');
    const step = isDeg ? 0.5 : 0.01;
    const display = () => isDeg ? currentParams[k].toFixed(1) + '°'
                                : currentParams[k].toFixed(2);
    row.innerHTML = `
      <label>${k.replace('_deg', '')}${isDeg ? ' (°)' : ''}</label>
      <input type="range" min="${mn}" max="${mx}" step="${step}" value="${currentParams[k]}">
      <span class="val"></span>`;
    const slider = row.querySelector('input');
    const val = row.querySelector('.val');
    val.textContent = display();
    slider.addEventListener('input', () => {
      currentParams[k] = parseFloat(slider.value);
      val.textContent = display();
      rebuild();
    });
    ui.paramsBox.appendChild(row);
  }
  // Drop stale params that are not part of the current lattice
  for (const k of Object.keys(currentParams)) {
    if (!(k in def.params)) delete currentParams[k];
  }
}

function currentCellChoice() {
  for (const r of ui.cellRadios()) if (r.checked) return r.value;
  return 'primitive';
}

function rebuild() {
  clearRoot();
  const def = LATTICES[ui.lattice.value];
  ui.info.textContent = def.note;

  // Real-space basis (always primitive for points + reciprocal calc)
  const prim = def.primitive(currentParams);
  const [a1, a2, a3] = prim;
  const conv = def.conventional(currentParams);

  // Reciprocal lattice (from PRIMITIVE vectors — this gives the true BZ)
  const [b1, b2, b3] = reciprocal(a1, a2, a3);

  // ─── BZ ────────────────────────────────────────────────────────────────
  if (ui.showBZ.checked) {
    const neigh = gatherNeighbors(b1, b2, b3, 3, 2.0);
    const { verts, faces } = wsCell(neigh);
    const { edges, tri } = bzGeometry(verts, faces);

    const seg = lineSegMesh(edges, 0xfacc15, 1.0);
    root.add(seg);

    if (ui.showBZFaces.checked && tri.positions.length) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(tri.positions, 3));
      g.setIndex(tri.indices);
      g.computeVertexNormals();
      const m = new THREE.MeshLambertMaterial({
        color: 0xfacc15, transparent: true, opacity: 0.18,
        side: THREE.DoubleSide, depthWrite: false,
      });
      root.add(new THREE.Mesh(g, m));
    }
    ui.diag.innerHTML =
      `|b₁| = ${norm(b1).toFixed(3)}<br>
       |b₂| = ${norm(b2).toFixed(3)}<br>
       |b₃| = ${norm(b3).toFixed(3)}<br>
       V_BZ = ${Math.abs(dot(b1, cross(b2, b3))).toFixed(3)}<br>
       BZ verts=${verts.length} faces=${faces.length}`;
  } else {
    ui.diag.textContent = '(BZ off)';
  }

  // ─── Real-space cell ────────────────────────────────────────────────────
  if (ui.showCell.checked) {
    const cell = currentCellChoice() === 'conventional' ? conv : prim;
    const edges = parallelepipedEdges(cell[0], cell[1], cell[2]);
    root.add(lineSegMesh(edges, 0x06b6d4, 0.9));
  }

  // ─── Real-space lattice points ──────────────────────────────────────────
  if (ui.showPoints.checked) {
    const cell = currentCellChoice() === 'conventional' ? conv : prim;
    const basis = currentCellChoice() === 'conventional'
                ? def.basis(currentParams)
                : [[0,0,0]];
    const pts = [];
    for (let i = -1; i <= 1; i++)
      for (let j = -1; j <= 1; j++)
        for (let k = -1; k <= 1; k++) {
          for (const f of basis) {
            const p = add(add(add(muls(cell[0], i + f[0]),
                                   muls(cell[1], j + f[1])),
                              muls(cell[2], k + f[2])), [0,0,0]);
            pts.push(p[0], p[1], p[2]);
          }
        }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    const m = new THREE.PointsMaterial({ color: 0xffffff, size: 0.06, sizeAttenuation: true });
    root.add(new THREE.Points(g, m));
  }

  // ─── Real-space primitive arrows ───────────────────────────────────────
  if (ui.showReal.checked) {
    const vecs = currentCellChoice() === 'conventional' ? conv : prim;
    for (const v of vecs) root.add(arrow([0,0,0], v, 0xfb923c));
  }

  // ─── Reciprocal arrows ─────────────────────────────────────────────────
  if (ui.showRecip.checked) {
    for (const v of [b1, b2, b3]) root.add(arrow([0,0,0], v, 0xe879f9));
  }

  // ─── Cartesian k-axes ──────────────────────────────────────────────────
  if (ui.showAxes.checked) {
    const L = 1.4 * Math.max(norm(b1), norm(b2), norm(b3));
    root.add(arrow([0,0,0], [L,0,0], 0xef4444));   // k_x
    root.add(arrow([0,0,0], [0,L,0], 0x22c55e));   // k_y
    root.add(arrow([0,0,0], [0,0,L], 0x3b82f6));   // k_z
  }
}

// Hook up controls
ui.lattice.addEventListener('change', () => { buildParamControls(); rebuild(); });
for (const r of ui.cellRadios()) r.addEventListener('change', rebuild);
for (const id of ['show-bz','show-bz-faces','show-cell','show-points',
                   'show-real','show-recip','show-axes']) {
  document.getElementById(id).addEventListener('change', rebuild);
}

// ─────────────────────── 7. Boot ──────────────────────────────────────────
buildParamControls();
onResize();
rebuild();

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
